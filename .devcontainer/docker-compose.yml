services:
  website:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - ./.zshrc:/home/vscode/.zshrc
    working_dir: /workspace
    command: sleep infinity
    ports:
      - "4321:4321"

  vale:
    image: jdkato/vale:latest
    container_name: vale
    volumes:
      - ..:/workspace
    working_dir: /workspace
    entrypoint: ["sleep", "infinity"]