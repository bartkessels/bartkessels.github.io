name: Test

on:
  workflow_call

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test
