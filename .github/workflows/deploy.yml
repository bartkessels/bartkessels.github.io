name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  check-content:
    uses: ./.github/workflows/check-content.yml

  test:
    uses: ./.github/workflows/test.yml

  test-e2e:
    uses: ./.github/workflows/test-e2e.yml

  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: [lint, check-content, test, test-e2e, build]
    uses: ./.github/workflows/deploy-pages.yml
