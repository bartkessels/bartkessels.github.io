name: E2E tests

on:
  workflow_call

jobs:
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm playwright install chromium firefox webkit --with-deps

      - name: Build
        run: pnpm build

      - name: Run e2e tests
        run: pnpm test:e2e
